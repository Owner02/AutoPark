<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автопарк организации</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🚗 Управление автопарком</h1>
            <nav class="tabs">
                <button class="tab-btn active" data-tab="vehicles">Автомобили</button>
                <button class="tab-btn" data-tab="drivers">Водители</button>
                <button class="tab-btn" data-tab="trips">Поездки</button>
            </nav>
        </header>

        <main>
            <!-- Раздел АВТОМОБИЛИ -->
            <div id="vehiclesTab" class="tab-content active">
                <div class="toolbar">
                    <input type="text" id="searchVehicles" placeholder="🔍 Поиск по госномеру, марке, водителю..." class="search-input">
                    <button id="addVehicleBtn" class="btn btn-primary">➕ Добавить авто</button>
                </div>
                <div id="vehicleForm" class="form-card hidden">
                    <h2 id="vehicleFormTitle">Добавить автомобиль</h2>
                    <div class="form-grid">
                        <div class="field"><label>Госномер *</label><input type="text" id="plate" placeholder="А123ВС77"></div>
                        <div class="field"><label>Марка/Модель</label><input type="text" id="model" placeholder="Toyota Camry"></div>
                        <div class="field"><label>Год выпуска</label><input type="number" id="year" placeholder="2020"></div>
                        <div class="field"><label>Пробег (км)</label><input type="number" id="mileage" placeholder="12500"></div>
                        <div class="field"><label>Статус</label>
                            <select id="status"><option value="В гараже">В гараже</option><option value="В рейсе">В рейсе</option><option value="На ремонте">На ремонте</option></select>
                        </div>
                    </div>
                    <div class="form-actions"><button id="saveVehicleBtn" class="btn btn-success">Сохранить</button><button id="cancelVehicleForm" class="btn btn-secondary">Отмена</button></div>
                    <div class="error-message" id="vehicleFormError"></div>
                </div>
                <div class="table-wrapper"><table id="vehiclesTable"><thead><tr><th>Госномер</th><th>Марка/Модель</th><th>Год</th><th>Пробег</th><th>Статус</th><th>Действия</th></tr></thead><tbody id="vehiclesBody"></tbody></table></div>
            </div>

            <!-- Раздел ВОДИТЕЛИ -->
            <div id="driversTab" class="tab-content">
                <div class="toolbar">
                    <input type="text" id="searchDrivers" placeholder="🔍 Поиск по ФИО, правам..." class="search-input">
                    <button id="addDriverBtn" class="btn btn-primary">➕ Добавить водителя</button>
                </div>
                <div id="driverForm" class="form-card hidden">
                    <h2 id="driverFormTitle">Добавить водителя</h2>
                    <div class="form-grid">
                        <div class="field"><label>ФИО *</label><input type="text" id="driverName" placeholder="Петров Иван Алексеевич"></div>
                        <div class="field"><label>Номер прав</label><input type="text" id="licenseNum" placeholder="77 00 123456"></div>
                        <div class="field"><label>Стаж (лет)</label><input type="number" id="experience" placeholder="5"></div>
                        <div class="field"><label>Телефон</label><input type="tel" id="driverPhone" placeholder="+7 (999) 123-45-67"></div>
                    </div>
                    <div class="form-actions"><button id="saveDriverBtn" class="btn btn-success">Сохранить</button><button id="cancelDriverForm" class="btn btn-secondary">Отмена</button></div>
                    <div class="error-message" id="driverFormError"></div>
                </div>
                <div class="table-wrapper"><table id="driversTable"><thead><tr><th>ФИО</th><th>Права</th><th>Стаж</th><th>Телефон</th><th>Действия</th></tr></thead><tbody id="driversBody"></tbody></table></div>
            </div>

            <!-- Раздел ПОЕЗДКИ -->
            <div id="tripsTab" class="tab-content">
                <div class="toolbar">
                    <input type="text" id="searchTrips" placeholder="🔍 Назначение, водитель, авто..." class="search-input">
                    <button id="addTripBtn" class="btn btn-primary">➕ Создать поездку</button>
                </div>
                <div id="tripForm" class="form-card hidden">
                    <h2 id="tripFormTitle">Новая поездка</h2>
                    <div class="form-grid">
                        <div class="field"><label>Дата *</label><input type="date" id="tripDate"></div>
                        <div class="field"><label>Водитель *</label><select id="driverSelect"></select></div>
                        <div class="field"><label>Автомобиль *</label><select id="carSelect"></select></div>
                        <div class="field"><label>Назначение</label><input type="text" id="purpose" placeholder="Доставка, встреча..."></div>
                        <div class="field"><label>Пробег (км)</label><input type="number" id="tripDistance" placeholder="0"></div>
                        <div class="field"><label>Расход топлива (л)</label><input type="number" id="fuelUsed" placeholder="0"></div>
                    </div>
                    <div class="form-actions"><button id="saveTripBtn" class="btn btn-success">Сохранить</button><button id="cancelTripForm" class="btn btn-secondary">Отмена</button></div>
                    <div class="error-message" id="tripFormError"></div>
                </div>
                <div class="stats-panel" id="tripStats">Общий пробег: — км | Средний расход: — л/100км</div>
                <div class="table-wrapper"><table id="tripsTable"><thead><tr><th>Дата</th><th>Водитель</th><th>Автомобиль</th><th>Назначение</th><th>Пробег</th><th>Топливо (л)</th><th>Действия</th></tr></thead><tbody id="tripsBody"></tbody></table></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
